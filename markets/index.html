<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sidestr · markets</title>
<meta name="description" content="Prediction markets on a sidestr chain: a question, YES and NO minted in pairs against sats, priced by pools, settled by a named resolver. Every block validated in the page.">
<meta property="og:site_name" content="sidestr"><meta property="og:title" content="sidestr markets"><meta property="og:description" content="Prediction markets on a sidestr chain: YES and NO minted in pairs against sats, priced by pools, settled by a named resolver. Every block validated in the page."><meta property="og:type" content="website"><meta property="og:url" content="https://play-grounds.github.io/sidestr/markets/"><meta property="og:image" content="https://play-grounds.github.io/sidestr/exchange/og.png"><meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#0a0c11;--panel:#10131b;--panel2:#161b26;--line:#1b2230;--line2:#273044;--text:#e8ebf2;--mut:#788198;--ac:#7c5cff;--good:#0ecb81;--bad:#f6465d;--warn:#f0b90b;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans)}a{color:var(--mut)}a:hover{color:var(--text)}
.mono{font-family:var(--mono)}.mut{color:var(--mut)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.tiny{font-size:.7rem;color:var(--mut)}.r{text-align:right}
.top{display:flex;align-items:center;gap:1.2rem;padding:.55rem 1rem;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}.brand{display:flex;align-items:baseline;gap:.45rem;padding-right:1.2rem;border-right:1px solid var(--line)}.brand b{font-size:.95rem}#who{margin-left:auto}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;box-shadow:0 0 6px rgba(14,203,129,.7)}
.wrap{max-width:1100px;margin:0 auto;padding:1rem}.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1rem}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;margin-bottom:1rem}.card h2{margin:0 0 .6rem;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.mk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem;align-items:center;padding:.7rem 0;border-top:1px solid var(--line);cursor:pointer}.mk:first-of-type{border-top:0}.mk:hover .q{color:var(--ac)}.q{font-size:1rem;font-weight:600}.meta{font-size:.72rem;color:var(--mut);margin-top:.2rem}
.odds{display:flex;gap:.4rem}.odd{min-width:82px;text-align:center;border-radius:8px;padding:.45rem .5rem;font-family:var(--mono);font-weight:700;font-size:1rem}.odd.yes{background:rgba(14,203,129,.12);color:var(--good)}.odd.no{background:rgba(246,70,93,.12);color:var(--bad)}.odd small{display:block;font:600 .6rem/1 var(--sans);letter-spacing:.08em;margin-top:.2rem;opacity:.8}
.bar{height:6px;border-radius:3px;background:rgba(246,70,93,.25);overflow:hidden;margin-top:.5rem}.bar i{display:block;height:100%;background:var(--good)}
.pill{display:inline-block;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .45rem;border-radius:4px;border:1px solid var(--line2);color:var(--mut)}.pill.open{color:var(--good);border-color:rgba(14,203,129,.4)}.pill.resolved{color:var(--ac);border-color:rgba(124,92,255,.4)}.pill.refunding{color:var(--warn);border-color:rgba(240,185,11,.4)}
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.55rem}.field label{font-size:.62rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}input,textarea,select{font:inherit;font-size:.86rem;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:.5rem .65rem;width:100%}input.mono{font-family:var(--mono)}input:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,92,255,.18)}textarea{resize:vertical;min-height:3.2rem}
button.cta{width:100%;font:inherit;font-weight:700;font-size:.83rem;border:0;border-radius:7px;padding:.65rem;cursor:pointer;color:#fff;background:var(--ac)}button.cta.yes{background:var(--good);color:#03261a}button.cta.no{background:var(--bad)}button.cta:disabled{opacity:.4;cursor:default}button.cta:hover:not(:disabled){filter:brightness(1.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.kv{display:flex;justify-content:space-between;gap:.6rem;padding:.24rem 0;border-top:1px solid var(--line);font-size:.76rem}.kv:first-child{border-top:0}.err{color:var(--bad);font-size:.74rem;margin-top:.4rem;min-height:.9rem}.out{font-size:.74rem;margin-top:.3rem}
.tabs{display:flex;gap:.15rem;margin-bottom:.6rem}.tabs button{font:inherit;font-size:.7rem;background:transparent;color:var(--mut);border:0;border-radius:4px;padding:.28rem .6rem;cursor:pointer}.tabs button.on{background:var(--panel2);color:var(--text)}
.foot{text-align:center;padding:.7rem 1rem 1.1rem}#toasts{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:50}.toast{background:#1c2331;border:1px solid var(--line2);border-left:3px solid var(--good);border-radius:8px;padding:.6rem .85rem;font-family:var(--mono);font-size:.74rem}.toast.out{opacity:0;transition:all .3s}
</style>
</head>
<body>
<div class="top"><div class="brand"><b>sidestr</b><span class="tiny">markets</span></div><span class="tiny" id="chainname">…</span><span class="tiny" id="who"></span></div>
<div class="wrap"><div class="grid"><div id="main"><div class="card"><div class="mut" id="boot">finding the chain from the relays…</div></div></div><div id="side"></div></div></div>
<p class="tiny foot">prediction markets on a sidestr chain (proposals/markets.md), every block validated here · <a href="../exchange/?chain=sidestr:predict">exchange</a> · <a href="../station/">station</a> · <a href="../">directory</a></p>
<div id="toasts"></div>
<script type="module">
import { openMarket, DEFAULTS } from '../tally/market.mjs'; import { Markets } from '../tally/markets.mjs';
const $ = (id) => document.getElementById(id); const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const LS = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
const q = new URLSearchParams(location.search); const chainId = q.get('chain') ?? 'sidestr:predict'; const relays = (LS.get('sidestr_relays') ?? DEFAULTS.relays.join(',')).split(',').map((x) => x.trim()).filter(Boolean);
const sats = (n) => Math.round(Number(n)).toLocaleString('en-US');
// a pool's price can sit above par when it is thin and one side was just bought; a unit is never worth more than a sat, so the display caps at 100 and says so
const pct = (p) => p == null ? '—' : p > 1 ? '<span title="the pool prices this side above par: split a pair and sell it">100%+</span>' : Math.round(p * 100) + '%';
let m = null, M = null, key = null, me = null, view = null, busy = false, tab = 'split';
const toast = (msg, kind) => { const el = document.createElement('div'); el.className = 'toast' + (kind === 'no' ? ' no' : ''); el.textContent = msg; $('toasts').appendChild(el); setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 350); }, 4500); };
async function boot() {
  const store = { get: LS.get, set: LS.set, delete: LS.del }, mirrorKey = `sidestr_mirror:${chainId}`; const remembered = LS.get(mirrorKey);
  try { m = await openMarket({ chain: chainId, mirror: remembered ?? undefined, relays, store }); } catch (e) { if (!remembered) { $('boot').innerHTML = `<span class="bad">could not open ${esc(chainId)}: ${esc(e.message)}</span>`; return; } LS.del(mirrorKey); try { m = await openMarket({ chain: chainId, relays, store }); } catch (e2) { $('boot').innerHTML = `<span class="bad">could not open ${esc(chainId)}: ${esc(e2.message)}</span>`; return; } }
  if (m.w.ex?.mirror) LS.set(mirrorKey, m.w.ex.mirror); if (!m.rules.markets) { $('boot').innerHTML = `<span class="bad">${esc(chainId)} does not name the markets rule</span>`; return; }
  M = new Markets(m); key = LS.get(`sidestr_key:${m.chain.id}`); me = key ? m.w.identity(key) : null; view = location.hash.startsWith('#/m/') ? location.hash.slice(4) : null; render();
  window.onhashchange = () => { view = location.hash.startsWith('#/m/') ? location.hash.slice(4) : null; render(); };
  m.w.followTips(async (t) => { for (let i = 0; i < 6 && (m.tip?.height ?? -1) < t.tip; i++) { await new Promise((r) => setTimeout(r, 2500)); await m.refresh(); } if (!busy) render(); }); }
function renderWho() { $('chainname').textContent = `${m.chain.name} · block ${m.tip?.height ?? '…'}`; $('who').innerHTML = `<span class="dot"></span>&nbsp;` + (me ? `<span class="mono" id="mykey" title="click to copy your public key" style="cursor:pointer">${esc(me.address.slice(0, 12))}…</span> · <span id="bal">${sats(m.w.balance(me.script).spendable)} sats</span> · <a href="#" id="faucet">get test coins</a> · <a href="#" id="forget">forget</a>` : `<a href="#" id="mk">make a key</a> · <a href="#" id="imp">paste one</a>`);
  if ($('mykey')) $('mykey').onclick = async () => { try { await navigator.clipboard.writeText(me.pub); toast(`public key copied: ${me.pub.slice(0, 16)}…`); } catch { prompt('your public key', me.pub); } };
  if ($('faucet')) $('faucet').onclick = async (e) => { e.preventDefault(); const a = $('faucet'); a.textContent = 'asking a faucet…'; try { const r = await m.w.requestFaucet(me.address, relays); if (!r.accepted) throw new Error('no relay accepted the request'); a.textContent = 'asked; coins arrive with the next block'; for (let i = 0; i < 24; i++) { await new Promise((res) => setTimeout(res, 5000)); await m.refresh(); if (m.w.balance(me.script).spendable > 0) { toast('test coins arrived'); render(); return; } } a.textContent = 'get test coins'; } catch (err) { a.textContent = 'get test coins'; $('chainname').textContent = err.message; } };
  if ($('forget')) $('forget').onclick = (e) => { e.preventDefault(); LS.del(`sidestr_key:${m.chain.id}`); key = null; me = null; render(); }; if ($('mk')) $('mk').onclick = (e) => { e.preventDefault(); key = m.w.newKey(); LS.set(`sidestr_key:${m.chain.id}`, key); me = m.w.identity(key); render(); }; if ($('imp')) $('imp').onclick = (e) => { e.preventDefault(); const v = prompt('key (64 hex characters)'); if (!v) return; try { m.w.identity(v.trim().toLowerCase()); key = v.trim().toLowerCase(); LS.set(`sidestr_key:${m.chain.id}`, key); me = m.w.identity(key); render(); } catch (err) { alert(err.message); } }; }
function render() { renderWho(); const mk = view ? M.market(view) : null; if (view && !mk) { view = null; location.hash = ''; } mk ? renderMarket(mk) : renderList(); renderSide(mk); }
function renderList() { const list = M.list(); const h = M.height;
  $('main').innerHTML = `<div class="card"><h2>markets <span>${list.length} on ${esc(m.chain.name)}</span></h2>${list.length ? list.map((k) => `<div class="mk" data-id="${k.id}"><div><div class="q">${esc(k.question)}</div><div class="meta"><span class="pill ${k.status}">${k.status === 'resolved' ? 'resolved ' + k.winner.toUpperCase() : k.status}</span> · ${k.status === 'open' ? (k.blocksLeft ? `${k.blocksLeft} blocks to expiry` : `expired, ${Math.max(0, k.expiry + k.grace - h)} blocks of grace`) : `expiry ${k.expiry}`} · ${sats(k.C)} sats at stake · resolver <span class="mono">${esc(k.resolver.slice(0, 8))}…</span></div>${k.pYes != null ? `<div class="bar"><i style="width:${Math.min(100, Math.round(k.pYes * 100))}%"></i></div>` : ''}</div><div class="odds"><div class="odd yes">${pct(k.pYes)}<small>YES</small></div><div class="odd no">${pct(k.pNo)}<small>NO</small></div></div></div>`).join('') : '<div class="tiny">no markets yet; open the first one on the right</div>'}</div>`;
  document.querySelectorAll('.mk').forEach((el) => { el.onclick = () => { location.hash = `#/m/${el.dataset.id}`; }; }); }
function renderMarket(k) { const h = M.height; const hold = me ? M.holdings(me.script, k.id) : null;
  $('main').innerHTML = `<div class="card"><h2><a href="#">← markets</a><span class="pill ${k.status}">${k.status === 'resolved' ? 'resolved ' + k.winner.toUpperCase() : k.status}</span></h2><div class="q" style="font-size:1.25rem">${esc(k.question)}</div>
    <div class="meta">opened at block ${k.opened} · expiry ${k.expiry} (${k.blocksLeft ? k.blocksLeft + ' blocks left' : 'passed'}) · grace ${k.grace} · resolver <span class="mono">${esc(k.resolver)}</span></div>
    <div style="display:flex;gap:1rem;margin:1rem 0;flex-wrap:wrap"><div class="odd yes" style="flex:1;font-size:1.6rem">${pct(k.pYes)}<small>YES · ${k.yesPool ? sats(k.yesPool.x) + ' sats in its pool' : 'no pool yet'}</small></div><div class="odd no" style="flex:1;font-size:1.6rem">${pct(k.pNo)}<small>NO · ${k.noPool ? sats(k.noPool.x) + ' sats in its pool' : 'no pool yet'}</small></div></div>
    <div class="kv"><span class="mut">collateral (sats behind every pair)</span><span class="mono">${sats(k.C)}</span></div><div class="kv"><span class="mut">your holdings</span><span class="mono">${hold ? `${sats(hold.yes)} YES · ${sats(hold.no)} NO` : 'make or paste a key'}</span></div>
    <div class="kv"><span class="mut">trade</span><span>${k.yesPool ? `<a href="../exchange/?chain=${encodeURIComponent(m.chain.id)}&pool=${k.yesPool.id}">YES / sats</a>` : 'no YES pool'} · ${k.noPool ? `<a href="../exchange/?chain=${encodeURIComponent(m.chain.id)}&pool=${k.noPool.id}">NO / sats</a>` : 'no NO pool'}</span></div>
    <div class="tiny" style="margin-top:.6rem">a pair is minted by locking sats and is always worth its collateral; the resolver's answer is a transaction signed by the key above; if it never comes, both sides refund at half par after block ${k.expiry + k.grace}</div></div>`;
  $('main').querySelector('h2 a').onclick = (e) => { e.preventDefault(); location.hash = ''; }; }
function renderSide(k) { const el = $('side'); if (!k) { renderOpenForm(el); return; } const hold = me ? M.holdings(me.script, k.id) : { yes: 0, no: 0 }; const canResolve = me && k.resolvable && me.pub === k.resolver;
  const tabs = [['split', 'split'], ['merge', 'merge'], ...(k.status === 'resolved' || k.refundable ? [['redeem', k.status === 'resolved' ? 'redeem' : 'refund']] : []), ...(canResolve ? [['resolve', 'resolve']] : []), ...(k.status === 'open' && (!k.yesPool || !k.noPool) ? [['pool', 'seed a pool']] : [])];
  if (!tabs.some(([t]) => t === tab)) tab = tabs[0][0];
  const form = { split: `<div class="field"><label><span>sats to lock</span><span>${me ? 'balance ' + sats(m.w.balance(me.script).spendable) : ''}</span></label><input id="amt" class="mono" inputmode="numeric" placeholder="10000"></div><div class="tiny">you receive that many YES and that many NO</div>`,
    merge: `<div class="field"><label><span>pairs to merge</span><span>you hold ${sats(hold.yes)} YES · ${sats(hold.no)} NO</span></label><input id="amt" class="mono" inputmode="numeric" placeholder="${Math.min(hold.yes, hold.no) || 0}"></div><div class="tiny">burns that many of each and releases that many sats</div>`,
    redeem: k.status === 'resolved' ? `<div class="field"><label><span>${k.winner.toUpperCase()} to redeem</span><span>you hold ${sats(k.winner === 'yes' ? hold.yes : hold.no)}</span></label><input id="amt" class="mono" inputmode="numeric" placeholder="${k.winner === 'yes' ? hold.yes : hold.no}"></div><div class="tiny">one sat per unit of the winning outcome</div>` : `<div class="row2"><div class="field"><label>YES</label><input id="amtY" class="mono" inputmode="numeric" value="${hold.yes}"></div><div class="field"><label>NO</label><input id="amtN" class="mono" inputmode="numeric" value="${hold.no}"></div></div><div class="tiny">unresolved past its grace: half a sat per unit, either side</div>`,
    resolve: `<div class="tiny" style="margin-bottom:.6rem">you are this market's resolver; the answer is final and goes into the chain signed by your key</div><div class="row2"><button class="cta yes" id="resY">YES</button><button class="cta no" id="resN">NO</button></div>`,
    pool: `<div class="row2"><div class="field"><label>side</label><select id="pside">${!k.yesPool ? '<option value="yes">YES</option>' : ''}${!k.noPool ? '<option value="no">NO</option>' : ''}</select></div><div class="field"><label>probability</label><input id="pp" class="mono" inputmode="decimal" value="0.5"></div></div><div class="field"><label><span>units to seed</span><span>you hold ${sats(hold.yes)} YES · ${sats(hold.no)} NO</span></label><input id="amt" class="mono" inputmode="numeric" placeholder="5000"></div><div class="tiny">opens a pool of that many units against units × probability sats; split first if you hold none</div>` }[tab];
  el.innerHTML = `<div class="card"><h2>act</h2><div class="tabs">${tabs.map(([t, l]) => `<button class="${t === tab ? 'on' : ''}" data-tab="${t}">${l}</button>`).join('')}</div>${form}${tab === 'resolve' ? '' : `<div style="margin-top:.6rem"><button class="cta" id="go">${me ? tab : 'make or paste a key'}</button></div>`}<div class="err" id="err"></div><div class="out" id="out"></div></div>`;
  el.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => { tab = b.dataset.tab; renderSide(k); }; });
  const run = async (build, label) => { if (!me || busy) return; busy = true; $('err').textContent = ''; try { const b = build(); $('out').textContent = `built ${b.txid.slice(0, 12)}… (${b.fee} sats fee); publishing…`; const r = await m.publish(b.hex, relays); if (!r.accepted) throw new Error('no relay accepted it'); $('out').textContent = 'published; waiting for the block…';
      for (let i = 0; i < 36; i++) { await new Promise((res) => setTimeout(res, 5000)); const x = await m.mined(b.txid); if (x) { busy = false; toast(`${label} · block ${x.height}`); render(); return; } } $('out').innerHTML = '<span class="warn">published, not yet in a block; it will show when it is</span>'; } catch (e) { $('err').textContent = e.message; } busy = false; };
  if ($('go')) $('go').onclick = () => { const n = Number(($('amt')?.value ?? '').replace(/,/g, '')); if (tab === 'split') run(() => M.buildSplit({ key, id: k.id, sats: n }), `split ${sats(n)}`); else if (tab === 'merge') run(() => M.buildMerge({ key, id: k.id, n }), `merged ${sats(n)} pairs`); else if (tab === 'redeem') run(() => k.status === 'resolved' ? M.buildRedeem({ key, id: k.id, n }) : M.buildRedeem({ key, id: k.id, yes: Number($('amtY').value), no: Number($('amtN').value) }), k.status === 'resolved' ? `redeemed ${sats(n)}` : 'refunded'); else if (tab === 'pool') run(() => M.buildOutcomePool({ key, id: k.id, side: $('pside').value, units: n, p: Number($('pp').value) }), 'pool opened'); };
  if ($('resY')) { $('resY').onclick = () => run(() => M.buildResolve({ key, id: k.id, outcome: 'yes' }), 'resolved YES', 'yes'); $('resN').onclick = () => run(() => M.buildResolve({ key, id: k.id, outcome: 'no' }), 'resolved NO', 'no'); } }
function renderOpenForm(el) { const h = M.height;
  el.innerHTML = `<div class="card"><h2>open a market</h2><div class="field"><label>question</label><textarea id="oq" placeholder="Will it rain in Prague on 1 October 2026?"></textarea></div><div class="row2"><div class="field"><label>expires in blocks</label><input id="oe" class="mono" inputmode="numeric" value="200"></div><div class="field"><label>grace blocks</label><input id="og" class="mono" inputmode="numeric" value="1000"></div></div><div class="field"><label>resolver key <span class="mut">64 hex, x-only</span></label><input id="or" class="mono" value="${me ? esc(me.pub) : ''}" placeholder="the key that will answer"></div><div style="margin-top:.6rem"><button class="cta" id="ogo">${me ? 'open' : 'make or paste a key'}</button></div><div class="err" id="err"></div><div class="out" id="out"></div><div class="tiny" style="margin-top:.6rem">block ${h} now; one block an hour when idle, ten seconds when there are transactions. Opening locks 1 sat in the market coin for its life.</div></div>
    <div class="card"><h2>how it works</h2><div class="tiny">A market is a question with a resolver's key, an expiry and a grace period. Anyone splits sats into equal YES and NO, trades either against sats in a pool, and merges pairs back. The resolver's answer is a transaction signed by that key; the winner then redeems one sat per unit. No answer by expiry plus grace: both sides refund at half par. Every reader validates all of it.</div></div>`;
  $('ogo').onclick = async () => { if (!me || busy) return; busy = true; $('err').textContent = ''; try { const b = M.buildOpen({ key, question: $('oq').value, resolver: $('or').value.trim(), expiry: h + Number($('oe').value), grace: Number($('og').value) }); $('out').textContent = 'built; publishing…'; const r = await m.publish(b.hex, relays); if (!r.accepted) throw new Error('no relay accepted it'); $('out').textContent = 'published; waiting for the block…'; for (let i = 0; i < 36; i++) { await new Promise((res) => setTimeout(res, 5000)); const x = await m.mined(b.txid); if (x) { busy = false; toast(`market opened · block ${x.height}`); location.hash = `#/m/${b.txid}`; render(); return; } } $('out').innerHTML = '<span class="warn">published, not yet in a block</span>'; } catch (e) { $('err').textContent = e.message; } busy = false; }; }
boot();
</script>
</body>
</html>
