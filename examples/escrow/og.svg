<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#141225"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.6"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.16"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#glow)"/><rect width="1200" height="8" fill="url(#top)"/>
  <text x="80" y="150" font-size="30" fill="#8b93a7" letter-spacing="6">SIDESTR · FIRST TRADE</text>
  <text x="80" y="250" font-size="78" font-weight="700" fill="#eef1f7">an escrow,</text>
  <text x="80" y="340" font-size="78" font-weight="700" fill="#eef1f7">explained</text>
  <text x="80" y="410" font-size="28" fill="#8b93a7">a hash lock and a deadline: the preimage</text>
  <text x="80" y="450" font-size="28" fill="#8b93a7">pays the payee; after it, only the payer</text>
  <text x="80" y="490" font-size="28" fill="#8b93a7">can take it back — the third role is none</text>
  <text x="80" y="560" font-size="26" fill="#2dd4bf">play-grounds.github.io/sidestr/examples/escrow</text>
  <rect x="780" y="90" width="340" height="450" rx="20" fill="#151923" stroke="#262d3d" stroke-width="2"/>
  <g font-family="DejaVu Sans Mono, Menlo, monospace" font-size="14" fill="#c9d1e3">
    <text x="802" y="126"><tspan fill="#c4b5fd">contract</tspan> Escrow {</text>
    <text x="802" y="152">  <tspan fill="#c4b5fd">function</tspan> lock(payee, h,</text>
    <text x="802" y="174">    deadline) <tspan fill="#c4b5fd">payable</tspan></text>
    <text x="802" y="196">  <tspan fill="#c4b5fd">function</tspan> claim(id,</text>
    <text x="802" y="218">    preimage) <tspan fill="#c4b5fd">external</tspan></text>
    <text x="802" y="240">  <tspan fill="#c4b5fd">function</tspan> refund(id)</text>
    <text x="802" y="262">}</text>
  </g>
  <rect x="802" y="284" width="296" height="1" fill="#262d3d"/>
  <g font-size="15">
    <text x="802" y="318" fill="#8b93a7">LOCKED</text><text x="802" y="348" font-size="30" font-weight="700" fill="#eef1f7">10,000 <tspan font-size="15" fill="#8b93a7">sats</tspan></text>
    <text x="802" y="384" fill="#8b93a7">TIME LEFT  <tspan fill="#eef1f7" font-weight="700">42 m 10 s</tspan></text>
    <rect x="802" y="408" width="150" height="40" rx="10" fill="#7c5cff"/><text x="877" y="434" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">claim it</text>
    <text x="802" y="478" fill="#8b93a7" font-size="13">only the preimage releases it,</text>
    <text x="802" y="498" fill="#8b93a7" font-size="13">and only to the payee</text>
    <text x="802" y="522" fill="#34d399">✓ claimed in block 531 · 41,612 gas</text>
  </g>
</svg>
