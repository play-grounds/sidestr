<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sidestr · exchange</title>
<meta property="og:site_name" content="sidestr">
<meta property="og:title" content="sidestr exchange">
<meta property="og:description" content="An exchange screen over a sidestr pool: candles from the chain's own trades, depth from the pool curve, a tape, market orders with the impact shown first. Every block validated in the page.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://play-grounds.github.io/sidestr/exchange/">
<meta property="og:image" content="https://play-grounds.github.io/sidestr/tally/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root { --bg:#0b0d12; --panel:#151923; --panel2:#1d2331; --line:#262d3d; --text:#eef1f7; --mut:#8b93a7; --ac:#7c5cff; --ac2:#2dd4bf; --good:#34d399; --warn:#f5b84f; --bad:#f87171; --mono:ui-monospace,Menlo,Consolas,monospace }
* { box-sizing:border-box } html,body { margin:0; background:#05060a; color:var(--text); font:13px/1.4 -apple-system,Inter,Segoe UI,Roboto,sans-serif }
.top { display:flex; align-items:center; gap:1.2rem; padding:.6rem 1rem; border-bottom:1px solid var(--line); background:var(--bg); flex-wrap:wrap } .top b { font-size:1rem } .tick { display:flex; gap:1.4rem; flex-wrap:wrap } .tick div { display:flex; flex-direction:column } .tick .k { font-size:.68rem; color:var(--mut) } .tick .v { font-weight:600; font-family:var(--mono) }
.grid { display:grid; grid-template-columns:1fr 320px; grid-template-rows:auto auto; gap:.8rem; padding:.8rem } .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:.8rem .9rem; min-width:0 } .card h2 { margin:0 0 .5rem; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); display:flex; justify-content:space-between } .card h2 span { text-transform:none; letter-spacing:0; font-weight:400 }
canvas { width:100%; display:block; background:#0b0d12; border-radius:10px } .mono { font-family:var(--mono) } .mut { color:var(--mut) } .good { color:var(--good) } .bad { color:var(--bad) } .warn { color:var(--warn) } .r { text-align:right }
table { width:100%; border-collapse:collapse } th { text-align:left; font-size:.68rem; color:var(--mut); font-weight:500; padding:.3rem .4rem; border-bottom:1px solid var(--line) } td { padding:.3rem .4rem; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:.78rem } tr:last-child td { border-bottom:0 }
.seg { display:flex; background:var(--panel2); border-radius:10px; padding:.15rem; margin-bottom:.6rem } .seg button { flex:1; background:transparent; color:var(--mut); padding:.45rem; border:0; border-radius:8px; font:inherit; cursor:pointer } .seg button.on { background:var(--panel); color:var(--text) } .seg button.buy.on { color:var(--good) } .seg button.sell.on { color:var(--bad) } .seg button:disabled { opacity:.4; cursor:default }
.field { display:flex; flex-direction:column; gap:.2rem; margin-bottom:.5rem } .field label { font-size:.68rem; color:var(--mut); display:flex; justify-content:space-between } input { font:inherit; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:.5rem .6rem; width:100%; font-family:var(--mono) }
button.cta { width:100%; font:inherit; font-weight:600; border:0; border-radius:10px; padding:.65rem; cursor:pointer; color:#fff; background:var(--ac) } button.cta.buy { background:var(--good); color:#062 } button.cta.sell { background:var(--bad); color:#300 } button.cta:disabled { opacity:.5; cursor:default } button.sm { font:inherit; font-size:.72rem; border:0; border-radius:8px; padding:.3rem .55rem; background:var(--panel2); color:var(--text); cursor:pointer }
.kv { display:flex; justify-content:space-between; gap:.6rem; padding:.22rem 0; border-top:1px solid var(--line); font-size:.78rem } .kv:first-child { border-top:0 } .tiny { font-size:.68rem; color:var(--mut) } .err { color:var(--bad); font-size:.8rem; margin-top:.4rem } .hidden { display:none }
.tabs { display:flex; gap:.4rem; margin-bottom:.5rem } .tabs button { font:inherit; font-size:.75rem; border:0; background:transparent; color:var(--mut); padding:.3rem .5rem; border-radius:8px; cursor:pointer } .tabs button.on { background:var(--panel2); color:var(--text) }
@media (max-width:900px) { .grid { grid-template-columns:1fr } }
</style>
</head>
<body>
<div class="top"><b>sidestr</b><span class="tiny">exchange</span><div class="tick" id="tick"><div><span class="k">market</span><span class="v" id="tpair">…</span></div><div><span class="k">last</span><span class="v" id="tlast">…</span></div><div><span class="k">24h change</span><span class="v" id="tchg">…</span></div><div><span class="k">24h volume</span><span class="v" id="tvol">…</span></div><div><span class="k">pool</span><span class="v" id="tpool">…</span></div><div><span class="k">block</span><span class="v" id="tblock">…</span></div></div><span style="flex:1"></span><span class="tiny" id="who"></span></div>
<div class="grid">
  <div class="card"><h2>price <span id="ctl"><button class="sm" data-tf="trade">per trade</button> <button class="sm" data-tf="3600">1h</button> <button class="sm" data-tf="86400">1d</button></span></h2><canvas id="chart" height="300"></canvas><div class="tiny" id="chartnote" style="margin-top:.3rem"></div></div>
  <div class="card" style="grid-row:span 2"><h2>order <span class="mut">market · the pool is the counterparty</span></h2>
    <div class="seg"><button class="buy on" data-side="buy">buy</button><button class="sell" data-side="sell">sell</button></div>
    <div class="seg"><button class="on">market</button><button disabled title="an AMM has no order book; limit orders are a rule proposal">limit</button></div>
    <div id="form"></div></div>
  <div class="card"><div class="tabs"><button class="on" data-t="depth">depth</button><button data-t="tape">trades</button><button data-t="pos">positions</button></div><div id="bottom"></div></div>
</div>
<script type="module">
import { openMarket, DEFAULTS } from '../tally/market.mjs';
const $ = (id) => document.getElementById(id); const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const LS = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
const q = new URLSearchParams(location.search); const chainId = q.get('chain') ?? 'sidestr:tally'; const relays = (LS.get('sidestr_relays') ?? DEFAULTS.relays.join(',')).split(',').map((x) => x.trim()).filter(Boolean);
const sats = (n) => Math.round(Number(n)).toLocaleString('en-US'); const px = (p) => Number(p).toLocaleString('en-US', { maximumFractionDigits: 2 });
let m = null, pool = null, key = null, me = null, side = 'buy', tf = 'trade', bottom = 'depth', S = { amount: '' }, busy = false;
window.exchange = { get market() { return m; } };
async function boot() { try { m = await openMarket({ chain: chainId, relays, store: { get: LS.get, set: LS.set, delete: LS.del } }); } catch (e) { $('form').innerHTML = `<div class="err">could not open ${esc(chainId)}: ${esc(e.message)}</div>`; return; }
  pool = m.pools()[0] ?? null; key = LS.get(`sidestr_key:${m.chain.id}`); me = key ? m.w.identity(key) : null; render();
  m.w.followTips(async (t) => { for (let i = 0; i < 6 && (m.tip?.height ?? -1) < t.tip; i++) { await new Promise((r) => setTimeout(r, 2500)); await m.refresh(); } if (!busy) render(); }); }
function render() { if (!pool) { $('form').innerHTML = `<div class="mut">no pool on ${esc(m.chain.name)} yet</div>`; return; } pool = m.pool(pool.id); const h = m.history(pool.id); const trades = h.filter((e) => e.kind === 'swap'); const now = Date.now() / 1000; const day = trades.filter((e) => e.time && e.time > now - 86400);
  const last = trades.length ? trades[trades.length - 1].price : pool.price * 10 ** pool.decimals; const first24 = day.length ? day[0].price : null; const chg = first24 ? (last / first24 - 1) * 100 : null;
  $('tpair').textContent = `${pool.ticker} / sats`; $('tlast').textContent = px(last); $('tchg').innerHTML = chg == null ? '<span class="mut">—</span>' : `<span class="${chg >= 0 ? 'good' : 'bad'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</span>`; $('tvol').textContent = sats(day.reduce((s, e) => s + e.volume, 0)) + ' sats'; $('tpool').textContent = `${sats(pool.x)} sats · ${m.fmt(pool.asset, pool.y)} ${pool.ticker}`; $('tblock').textContent = m.tip?.height ?? '…';
  $('who').innerHTML = me ? `key <span class="mono">${esc(me.address.slice(0, 12))}…</span> · <a href="#" id="forget" class="mut">forget</a>` : `<a href="#" id="mk" class="mut">make a key</a> · <a href="#" id="imp" class="mut">paste one</a>`;
  if ($('forget')) $('forget').onclick = (e) => { e.preventDefault(); LS.del(`sidestr_key:${m.chain.id}`); key = null; me = null; render(); }; if ($('mk')) $('mk').onclick = (e) => { e.preventDefault(); key = m.w.newKey(); LS.set(`sidestr_key:${m.chain.id}`, key); me = m.w.identity(key); render(); }; if ($('imp')) $('imp').onclick = (e) => { e.preventDefault(); const v = prompt('key (64 hex characters)'); if (!v) return; try { m.w.identity(v.trim().toLowerCase()); key = v.trim().toLowerCase(); LS.set(`sidestr_key:${m.chain.id}`, key); me = m.w.identity(key); render(); } catch (err) { alert(err.message); } };
  drawChart(trades); renderForm(); renderBottom(h); }
// --- chart: candles per trade, or per hour/day bucket; the mid price after each trade -------------------
function drawChart(trades) { const c = $('chart'); const W = c.width = c.clientWidth * devicePixelRatio, H = c.height = 300 * devicePixelRatio; const ctx = c.getContext('2d'); ctx.clearRect(0, 0, W, H); document.querySelectorAll('#ctl button').forEach((b) => b.style.color = b.dataset.tf === tf ? 'var(--text)' : '');
  let candles = []; if (tf === 'trade') candles = trades.map((e) => ({ t: e.time, o: e.mid - (e.mid - (e.x / e.y * 10 ** pool.decimals)), c: e.mid, h: Math.max(e.mid, e.x / e.y * 10 ** pool.decimals, e.price), l: Math.min(e.mid, e.x / e.y * 10 ** pool.decimals, e.price), v: e.volume }));
  else { const w = Number(tf); const by = new Map(); for (const e of trades) { if (!e.time) continue; const b = Math.floor(e.time / w) * w; const k = by.get(b) ?? { t: b, o: e.x / e.y * 10 ** pool.decimals, c: e.mid, h: -Infinity, l: Infinity, v: 0 }; k.c = e.mid; k.h = Math.max(k.h, e.mid, e.price); k.l = Math.min(k.l, e.mid, e.price); k.v += e.volume; by.set(b, k); } candles = [...by.values()]; }
  $('chartnote').textContent = candles.length ? `${trades.length} trade(s) · ${tf === 'trade' ? 'one candle per trade' : (tf === '3600' ? 'hourly' : 'daily') + ' candles'} · price in sats per ${pool.ticker}` : 'no trades yet; the first swap draws the first candle';
  if (!candles.length) return; const pad = 12 * devicePixelRatio, right = 64 * devicePixelRatio, bottomH = 40 * devicePixelRatio; const lo = Math.min(...candles.map((k) => k.l)) * 0.998, hi = Math.max(...candles.map((k) => k.h)) * 1.002; const y = (p) => pad + (hi - p) / (hi - lo || 1) * (H - pad * 2 - bottomH); const n = Math.max(candles.length, 20); const cw = (W - pad - right) / n; const maxv = Math.max(...candles.map((k) => k.v), 1);
  ctx.strokeStyle = '#262d3d'; ctx.lineWidth = 1; ctx.font = `${11 * devicePixelRatio}px ui-monospace, monospace`; ctx.fillStyle = '#8b93a7'; for (let i = 0; i <= 4; i++) { const p = lo + (hi - lo) * i / 4; const yy = y(p); ctx.beginPath(); ctx.moveTo(pad, yy); ctx.lineTo(W - right, yy); ctx.stroke(); ctx.fillText(px(p), W - right + 6 * devicePixelRatio, yy + 4 * devicePixelRatio); }
  candles.forEach((k, i) => { const x = pad + (i + 0.5) * cw; const up = k.c >= k.o; ctx.strokeStyle = ctx.fillStyle = up ? '#34d399' : '#f87171'; ctx.beginPath(); ctx.moveTo(x, y(k.h)); ctx.lineTo(x, y(k.l)); ctx.stroke(); const top = y(Math.max(k.o, k.c)), hgt = Math.max(2, Math.abs(y(k.o) - y(k.c))); ctx.fillRect(x - cw * 0.3, top, cw * 0.6, hgt); ctx.fillStyle = up ? 'rgba(52,211,153,.35)' : 'rgba(248,113,113,.35)'; const vh = k.v / maxv * (bottomH - 8 * devicePixelRatio); ctx.fillRect(x - cw * 0.3, H - pad - vh, cw * 0.6, vh); }); }
// --- the order form: a market order is a swap, quoted by the rule's own arithmetic -------------------------
function renderForm() { const sell = side === 'buy' ? 'sats' : 'asset'; const bal = me ? (side === 'buy' ? m.w.balance(me.script).spendable : (m.balances(me.script).get(pool.asset) ?? 0)) : null; let quote = null, err = '';
  const amt = side === 'buy' ? Math.round(Number(S.amount)) : (S.amount ? (() => { try { return m.parseAmount(pool.asset, S.amount); } catch (e) { err = e.message; return 0; } })() : 0);
  if (amt > 0 && !err) { try { quote = m.quoteSwap({ pool: pool.id, sell, amount: amt }); } catch (e) { err = e.message; } }
  const short = me && bal != null && amt > bal;
  $('form').innerHTML = `<div class="field"><label><span>${side === 'buy' ? 'spend sats' : 'sell ' + esc(pool.ticker)}</span><span>${me ? 'balance ' + (side === 'buy' ? sats(bal) : m.fmt(pool.asset, bal)) : ''}</span></label><input id="amt" inputmode="decimal" value="${esc(S.amount)}" placeholder="${side === 'buy' ? '100000' : '10.00'}"></div>
    ${quote ? `<div class="kv"><span class="mut">you get</span><span class="mono">${side === 'buy' ? m.fmt(pool.asset, quote.out) + ' ' + esc(pool.ticker) : sats(quote.out) + ' sats'}</span></div><div class="kv"><span class="mut">price</span><span class="mono">${px(side === 'buy' ? amt / quote.out * 10 ** pool.decimals : quote.out / amt * 10 ** pool.decimals)} sats/${esc(pool.ticker)}</span></div><div class="kv"><span class="mut">impact</span><span class="${quote.impact > 0.05 ? 'warn' : ''}">${(quote.impact * 100).toFixed(2)}%</span></div><div class="kv"><span class="mut">pool fee</span><span>0.3% · ${side === 'buy' ? sats(quote.fee) + ' sats' : m.fmt(pool.asset, quote.fee) + ' ' + esc(pool.ticker)}</span></div>` : ''}
    <div style="margin-top:.6rem"><button class="cta ${side}" id="go" ${!me || !quote || short || busy ? 'disabled' : ''}>${!me ? 'make or paste a key' : short ? 'not enough' : quote ? (side === 'buy' ? 'buy ' + esc(pool.ticker) : 'sell ' + esc(pool.ticker)) : 'enter an amount'}</button></div><div class="err" id="ferr">${esc(err)}</div><div id="fout" class="tiny" style="margin-top:.4rem"></div>
    <div class="tiny" style="margin-top:.6rem">a market order is a swap against the pool, checked here against the chain's rules before it is published; the price moves with your size</div>`;
  $('amt').oninput = () => { S.amount = $('amt').value; renderForm(); }; $('amt').onkeydown = (e) => { if (e.key === 'Enter' && !$('go').disabled) $('go').click(); };
  $('go').onclick = async () => { busy = true; renderForm(); const out = $('fout'); try { const b = m.buildSwap({ key, pool: pool.id, sell, amount: amt }); out.textContent = 'publishing…'; const r = await m.publish(b.hex, relays); if (!r.accepted) throw new Error('no relay accepted it'); out.textContent = 'published; waiting for the block…'; for (let i = 0; i < 36; i++) { await new Promise((res) => setTimeout(res, 5000)); const x = await m.mined(b.txid); if (x) { S.amount = ''; busy = false; render(); $('fout').innerHTML = `<span class="good">filled in block ${x.height}</span>`; return; } } out.innerHTML = '<span class="warn">published, not yet mined</span>'; } catch (e) { out.innerHTML = `<span class="bad">${esc(e.message)}</span>`; } busy = false; renderForm(); };
  document.querySelectorAll('.seg button[data-side]').forEach((b) => { b.classList.toggle('on', b.dataset.side === side); b.onclick = () => { side = b.dataset.side; S.amount = ''; renderForm(); }; }); }
function renderBottom(h) { document.querySelectorAll('.tabs button').forEach((b) => { b.classList.toggle('on', b.dataset.t === bottom); b.onclick = () => { bottom = b.dataset.t; renderBottom(m.history(pool.id)); }; }); const el = $('bottom');
  if (bottom === 'depth') { const d = m.depth(pool.id); el.innerHTML = `<table><tr><th>move the price by</th><th class="r">buying takes</th><th class="r">selling takes</th></tr>${d.map((r) => `<tr><td>${(r.move * 100).toFixed(1)}%</td><td class="r good">${sats(r.buySats)} sats</td><td class="r bad">${sats(r.sellSats)} sats</td></tr>`).join('')}</table><div class="tiny" style="margin-top:.4rem">from the constant product x·y = k with a 0.3% fee: what it costs to push the mid price, the AMM's version of an order book</div>`; }
  else if (bottom === 'tape') { const t = h.filter((e) => e.kind === 'swap').slice().reverse(); el.innerHTML = t.length ? `<table><tr><th>time</th><th>side</th><th class="r">price</th><th class="r">${esc(pool.ticker)}</th><th class="r">sats</th><th>block</th></tr>${t.slice(0, 40).map((e) => `<tr><td>${e.time ? new Date(e.time * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'}</td><td class="${e.side === 'buy' ? 'good' : 'bad'}">${e.side}</td><td class="r">${px(e.price)}</td><td class="r">${m.fmt(pool.asset, Math.abs(e.dy))}</td><td class="r">${sats(e.volume)}</td><td><a href="https://sidestr.com/explorer/?chain=${encodeURIComponent(chainId)}#/block/${e.height}" target="_blank" rel="noopener" class="mut">${e.height}</a></td></tr>`).join('')}</table>` : '<div class="mut">no trades yet</div>'; }
  else { if (!me) return (el.innerHTML = '<div class="mut">make or paste a key to see positions</div>'); const b = m.balances(me.script); el.innerHTML = `<table><tr><th>asset</th><th class="r">balance</th><th class="r">value in sats</th></tr><tr><td>sats</td><td class="r">${sats(m.w.balance(me.script).spendable)}</td><td class="r">${sats(m.w.balance(me.script).spendable)}</td></tr>${m.assets().map((a) => { const n = b.get(a.id) ?? 0; const v = a.share ? Math.round(n / pool.shares * 2 * pool.x) : Math.round(n / pool.y * pool.x); return `<tr><td>${esc(a.ticker)}${a.share ? ' <span class="tiny">pool share</span>' : ''}</td><td class="r">${a.share ? sats(n) : m.fmt(a.id, n)}</td><td class="r">${sats(v)}</td></tr>`; }).join('')}</table><div class="tiny" style="margin-top:.4rem">values at the pool's mid price; a share is its pro-rata part of the pool</div>`; } }
document.querySelectorAll('#ctl button').forEach((b) => { b.onclick = () => { tf = b.dataset.tf; render(); }; });
window.addEventListener('resize', () => { if (m && pool) drawChart(m.history(pool.id).filter((e) => e.kind === 'swap')); });
boot();
</script>
</body>
</html>
