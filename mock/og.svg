    <circle cx="874" cy="548" r="14" fill="#1d2331"/><text x="874" y="553" fill="#eef1f7" text-anchor="middle">⇄</text><text x="896" y="545" fill="#eef1f7" font-weight="700">Swapped SHELL</text><text x="896" y="562" font-size="11" fill="#8b93a7">today · on tally</text><text x="1076" y="553" fill="#34d399" text-anchor="end" font-weight="700" font-size="12">+200,000</text>
