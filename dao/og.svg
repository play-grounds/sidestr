  <circle cx="840" cy="300" r="14" fill="#f5b84f"/><text x="840" y="305" font-size="14" font-weight="700" fill="#05060a" text-anchor="middle">m</text>
  <text x="864" y="305" font-size="18" fill="#eef1f7" font-weight="700">melvin</text><text x="1096" y="305" font-size="18" fill="#eef1f7" text-anchor="end" font-weight="700">95%</text>
  <rect x="864" y="316" width="232" height="6" rx="3" fill="#1d2331"/><rect x="864" y="316" width="220" height="6" rx="3" fill="#f5b84f"/>
  <circle cx="840" cy="356" r="14" fill="#60a5fa"/><text x="840" y="361" font-size="14" font-weight="700" fill="#05060a" text-anchor="middle">k</text>
  <text x="864" y="361" font-size="18" fill="#eef1f7" font-weight="700">kessa</text><text x="1096" y="361" font-size="18" fill="#eef1f7" text-anchor="end" font-weight="700">5%</text>
  <rect x="864" y="372" width="232" height="6" rx="3" fill="#1d2331"/><rect x="864" y="372" width="12" height="6" rx="3" fill="#60a5fa"/>
