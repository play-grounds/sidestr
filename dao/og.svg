<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#101a2a"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5b84f"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.6"><stop offset="0" stop-color="#f5b84f" stop-opacity="0.18"/><stop offset="1" stop-color="#f5b84f" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#glow)"/><rect width="1200" height="8" fill="url(#top)"/>
  <text x="80" y="150" font-size="30" fill="#8b93a7" letter-spacing="6">SIDESTR · TIDEHOLM · MOCKUP</text>
  <text x="80" y="250" font-size="78" font-weight="700" fill="#eef1f7">a dao the chain</text>
  <text x="80" y="340" font-size="78" font-weight="700" fill="#eef1f7">can prove</text>
  <text x="80" y="410" font-size="28" fill="#8b93a7">shares as an asset · a treasury in coins</text>
  <text x="80" y="450" font-size="28" fill="#8b93a7">proposals with a veto window</text>
  <text x="80" y="490" font-size="28" fill="#8b93a7">and the right to leave with your share</text>
  <text x="80" y="560" font-size="26" fill="#60a5fa">play-grounds.github.io/sidestr/dao</text>
  <!-- treasury card -->
  <rect x="800" y="90" width="320" height="120" rx="20" fill="#151923" stroke="#262d3d" stroke-width="2"/>
