  <text x="824" y="196" font-size="14" fill="#34d399">✓ verified by this page</text>
  <!-- holders card -->
  <rect x="800" y="230" width="320" height="170" rx="20" fill="#151923" stroke="#262d3d" stroke-width="2"/>
