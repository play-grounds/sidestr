<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#141227"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.6"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#glow)"/><rect width="1200" height="8" fill="url(#top)"/>
  <text x="80" y="150" font-size="30" fill="#8b93a7" letter-spacing="6">SIDESTR · IDE</text>
  <text x="80" y="250" font-size="78" font-weight="700" fill="#eef1f7">compile, deploy,</text>
  <text x="80" y="340" font-size="78" font-weight="700" fill="#eef1f7">call. one page.</text>
  <text x="80" y="410" font-size="28" fill="#8b93a7">solidity compiled in the browser</text>
  <text x="80" y="450" font-size="28" fill="#8b93a7">signed with the key that holds your sats</text>
  <text x="80" y="490" font-size="28" fill="#8b93a7">read from the state your page validated</text>
  <text x="80" y="560" font-size="26" fill="#2dd4bf">play-grounds.github.io/sidestr/ide</text>
  <rect x="780" y="90" width="340" height="450" rx="20" fill="#151923" stroke="#262d3d" stroke-width="2"/>
  <g font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#c9d1e3">
    <text x="804" y="128" fill="#8b93a7">// Token.sol</text>
    <text x="804" y="156"><tspan fill="#c4b5fd">contract</tspan> Token {</text>
    <text x="804" y="184">  <tspan fill="#c4b5fd">string public</tspan> symbol;</text>
    <text x="804" y="212">  <tspan fill="#c4b5fd">mapping</tspan>(address =&gt; uint256)</text>
    <text x="804" y="240">    <tspan fill="#c4b5fd">public</tspan> balanceOf;</text>
    <text x="804" y="268">  <tspan fill="#c4b5fd">function</tspan> transfer(...)</text>
    <text x="804" y="296">}</text>
  </g>
  <rect x="804" y="330" width="292" height="1" fill="#262d3d"/>
  <g font-size="15">
    <text x="804" y="366" fill="#34d399">✓ compiled Token (2512 bytes)</text>
    <text x="804" y="396" fill="#34d399">✓ deployed in block 195</text>
    <text x="804" y="420" fill="#8b93a7">  0x1afaa9c3…c6d0cf4b</text>
    <text x="804" y="452" fill="#eef1f7">symbol() → <tspan fill="#2dd4bf">SHELL</tspan></text>
    <text x="804" y="480" fill="#eef1f7">balanceOf(me) → <tspan fill="#2dd4bf">99998750</tspan></text>
    <text x="804" y="512" fill="#34d399">✓ transfer sent · block 196</text>
  </g>
</svg>
