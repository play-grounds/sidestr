<html lang="en">
<head>

<style>
:root { --bg:#0b0d12; --panel:#151923; --panel2:#1d2331; --line:#262d3d; --text:#eef1f7; --mut:#8b93a7; --ac:#7c5cff; --ac2:#2dd4bf; --good:#34d399; --warn:#f5b84f; --bad:#f87171; --mono:ui-monospace,Menlo,Consolas,monospace }
* { box-sizing:border-box } html,body { margin:0; background:#05060a; color:var(--text); font:15px/1.45 -apple-system,Inter,Segoe UI,Roboto,sans-serif }
body { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:1rem 1rem 2rem }
.phone { width:100%; max-width:420px; background:var(--bg); border:1px solid var(--line); border-radius:28px; min-height:78vh; display:flex; flex-direction:column; overflow:hidden }
.top { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.1rem .4rem } .top b { font-size:1.05rem } .pill { font-size:.75rem; color:var(--mut); border:1px solid var(--line); border-radius:999px; padding:.15rem .6rem }
.screen { flex:1; padding:.6rem 1.1rem 1rem; display:flex; flex-direction:column; gap:.9rem }
.card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:1rem 1.1rem } .card h2 { margin:0 0 .5rem; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut) }
.big { font-size:2.1rem; font-weight:700; letter-spacing:-.02em } .big small { font-size:1rem; color:var(--mut); font-weight:500; margin-left:.3rem }
.row { display:flex; justify-content:space-between; align-items:center; gap:.6rem; padding:.35rem 0; border-top:1px solid var(--line) } .row:first-of-type { border-top:0 }
.mut { color:var(--mut) } .mono { font-family:var(--mono); font-size:.82rem; word-break:break-all } .good { color:var(--good) } .bad { color:var(--bad) } .warn { color:var(--warn) }
button { font:inherit; border:0; border-radius:14px; padding:.75rem 1rem; cursor:pointer; background:var(--panel2); color:var(--text) } button.ac { background:var(--ac); color:#fff; font-weight:600 } button:disabled { opacity:.5; cursor:default }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:.6rem } input,textarea { width:100%; font:inherit; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:.7rem .8rem }
.tabs { display:flex; border-top:1px solid var(--line); background:var(--panel) } .tabs button { flex:1; border-radius:0; background:transparent; color:var(--mut); padding:.9rem 0; font-size:.8rem } .tabs button.on { color:var(--text) }
.qr { background:#fff; padding:.6rem; border-radius:12px; display:inline-block; line-height:0 } .qr img,.qr canvas,.qr table { max-width:100% }
.boot { color:var(--mut); font-size:.85rem; padding:1rem 1.1rem } .err { color:var(--bad); font-size:.9rem } .sheet { display:flex; flex-direction:column; gap:.7rem; align-items:center; text-align:center }
.tiny { font-size:.72rem; color:var(--mut) } .hidden { display:none }
.act { display:flex; align-items:center; gap:.7rem; padding:.55rem 0; border-top:1px solid var(--line) } .act:first-child { border-top:0 } .act .ic { width:2rem; height:2rem; border-radius:50%; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-weight:700; flex:none } .act .t { flex:1; min-width:0 } .act .t div:last-child { font-size:.75rem; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .act .amt { font-weight:600; white-space:nowrap } a.act { color:inherit; text-decoration:none }
.seg { display:flex; background:var(--panel2); border-radius:12px; padding:.2rem } .seg button { flex:1; padding:.5rem; border-radius:10px; background:transparent; color:var(--mut); font-size:.85rem } .seg button.on { background:var(--panel); color:var(--text) }
.field { display:flex; flex-direction:column; gap:.3rem } .field label { font-size:.75rem; color:var(--mut) } .kv { display:flex; justify-content:space-between; gap:1rem; padding:.3rem 0; border-top:1px solid var(--line); font-size:.9rem } .kv:first-child { border-top:0 } .kv span:last-child { text-align:right; word-break:break-all }
</style>
</head>
<body>
<div class="phone">
  <div class="top"><b>sidestr</b><span class="pill" id="pill">opening…</span></div>
  <div class="screen" id="screen"><div class="boot" id="boot">loading the wallet…</div></div>
  <div class="tabs">
    <button class="on" data-tab="home">Home</button><button data-tab="activity">Activity</button><button data-tab="send">Send</button><button data-tab="tokens" id="tabtokens">Tokens</button><button data-tab="more">More</button>
  </div>
</div>
<p class="tiny">phone wallet: home, receive, activity, send, tokens, chains and settings · <a href="../" style="color:var(--mut)">directory</a> · <a href="https://sidestr.com/wallet/" style="color:var(--mut)">plain wallet</a></p>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { listChains } from '../sidechains.mjs';
import { openWallet, DEFAULTS } from 'https://cdn.jsdelivr.net/gh/sidestr/wallet@bb8d06ac0755f6faa54d6126f483300ca2720109/wallet.mjs';
const $ = (id) => document.getElementById(id); const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const LS = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
const sats = (n) => Number(n).toLocaleString('en-US');
const EXPLORER_UI = 'https://sidestr.com/explorer/'; const explore = (kind, id) => `${EXPLORER_UI}?chain=${encodeURIComponent(chainId)}#/${kind}/${id}`;
// one feed: sidechain coins in and out, and the EVM receipts that touched this key, merged by block; a receipt whose carrier is one of our own transactions folds into that row
function activityFor(script, ethAddr) {
  // net per transaction: what this key received minus what it spent, so a send with change is one row
  const byTx = new Map(); for (const h of w.history(script)) { const x = byTx.get(h.txid) ?? { height: h.height, txid: h.txid, net: 0 }; x.net += h.dir === 'in' ? h.value : -h.value; byTx.set(h.txid, x); }
  const rows = [...byTx.values()].map((x) => ({ height: x.height, txid: x.txid, dir: x.net >= 0 ? 'in' : 'out', value: Math.abs(x.net), evm: null }));
  for (const r of (ethAddr ? w.evmActivity(ethAddr) : [])) { const own = rows.find((x) => x.txid === r.sidechainTxid); if (own) own.evm = r; else rows.push({ height: r.height, txid: r.sidechainTxid, dir: null, value: null, evm: r }); }
  return rows.sort((a, b) => b.height - a.height || (a.dir === 'out' ? -1 : 1));
}
function describe(x, ethAddr) {
  const r = x.evm; if (!r) return x.dir === 'in' ? 'received' : 'sent';
  const mine = ethAddr && r.from?.toLowerCase() === ethAddr.toLowerCase(); const what = r.contractAddress ? `deployed ${r.contractAddress.slice(0, 10)}…` : r.to?.toLowerCase() === '0x00000000000000000000000000000000000501de' ? 'withdrawal to this chain' : mine ? `call to ${(r.to ?? '').slice(0, 10)}…` : `from ${r.from.slice(0, 10)}…`;
  return `EVM · ${what}${r.status === 1 ? '' : ' · reverted'}`;
}
window.sidestr = { get wallet() { return w; }, activityFor }; // for the console
const q = new URLSearchParams(location.search); const chainId = q.get('chain') ?? 'sidestr:txbt4-evm'; const mirror = q.get('mirror') ?? undefined;
let w = null, key = null, view = 'home', evmBal = null, mode = 'send', pending = null, tokens = [];
const tokKey = () => `sidestr_tokens:${w.chain.id}`; const loadTokens = () => { try { tokens = JSON.parse(LS.get(tokKey()) ?? '[]'); } catch { tokens = []; } const one = LS.get(`sidestr_token:${w.chain.id}`); if (one && !tokens.includes(one.toLowerCase())) tokens.push(one.toLowerCase()); };
const relays = (LS.get('sidestr_relays') ?? DEFAULTS.relays.join(',')).split(',').map((x) => x.trim()).filter(Boolean);
async function boot() {
  try {
    w = await openWallet({ chain: mirror ? undefined : chainId, mirror, relays, store: { get: LS.get, set: LS.set, delete: LS.del }, onProgress: (s) => { const b = $('boot'); if (b) b.textContent = s + '…'; } });
    key = LS.get(`sidestr_key:${w.chain.id}`); // the same key the plain wallet keeps for this chain
    loadTokens(); if (!w.evm) $('tabtokens').classList.add('hidden');
    render(); refreshEvm();
    w.followTips(async (t) => { for (let i = 0; i < 6 && (w.tip?.height ?? -1) < t.tip; i++) { await new Promise((r) => setTimeout(r, 2500)); await w.refresh(); } render(); refreshEvm(); });
  } catch (e) { $('screen').innerHTML = `<div class="card"><div class="err"><b>could not open ${esc(chainId)}</b><br>${esc(e.message)}</div></div>`; console.error(e); }
}
async function refreshEvm() { if (!w?.evm || !key) return; try { const b = await w.evmBalance(w.ethAddress(key)); evmBal = Number(b / 1000000000n); } catch { evmBal = null; } const el = $('evmbal'); if (el) el.textContent = evmBal === null ? '…' : sats(evmBal); }
function render() {
  $('pill').innerHTML = `${esc(w.chain.name)} · ${w.tip?.height ?? 0}${w.fromCache === null ? '' : ' ⚡'} ▾`; $('pill').style.cursor = 'pointer'; $('pill').onclick = () => go('more'); $('pill').title = w.fromCache === null ? 'every block validated here' : `validated from the state saved here at block ${w.fromCache}`;
  const s = $('screen');
  if (view === 'more') { renderMore(key ? w.identity(key) : null); return; }
  if (!key) { s.innerHTML = `<div class="card"><h2>your key</h2><p>No key in this browser for <b>${esc(w.chain.name)}</b>. Make one, or paste one you saved. The plain wallet shares it.</p>
    <div class="actions"><button class="ac" id="mk">make a new key</button><button id="imp">paste a key</button></div><div id="impbox" class="hidden" style="margin-top:.6rem"><input id="impv" placeholder="64 hex characters" autocomplete="off"><button id="impgo" style="margin-top:.5rem">use it</button><div class="err" id="imperr"></div></div></div>`;
    $('mk').onclick = () => { key = w.newKey(); LS.set(`sidestr_key:${w.chain.id}`, key); render(); refreshEvm(); };
    $('imp').onclick = () => $('impbox').classList.toggle('hidden');
    $('impgo').onclick = () => { const v = $('impv').value.trim().toLowerCase(); try { w.identity(v); key = v; LS.set(`sidestr_key:${w.chain.id}`, key); render(); refreshEvm(); } catch (e) { $('imperr').textContent = e.message; } };
    return;
  }
  const me = w.identity(key); const b = w.balance(me.script); const coins = w.coins(me.script);
  if (view === 'activity') {
    const eth = w.evm ? w.ethAddress(key) : null; const list = activityFor(me.script, eth);
    s.innerHTML = `<div class="card"><h2>activity</h2>${list.length ? list.map((x) => { const t = w.ex.blocks[x.height]?.time; const when = t ? new Date(t * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' · ' : ''; const ic = x.evm ? '⚙' : x.dir === 'in' ? '+' : '−';
      return `<a class="act" href="${explore('tx', x.txid)}" target="_blank" rel="noopener"><div class="ic ${x.dir === 'in' ? 'good' : ''}">${ic}</div><div class="t"><div>${esc(describe(x, eth))}</div><div>${esc(when)}block ${x.height} · ${esc(x.txid.slice(0, 10))}…</div></div><div class="amt ${x.dir === 'in' ? 'good' : ''}">${x.value == null ? '' : (x.dir === 'in' ? '+' : '−') + sats(x.value)}</div></a>`; }).join('') : '<div class="mut">nothing yet</div>'}</div>`;
    return;
  }
  if (view === 'send') { renderSend(me, b); return; }
  if (view === 'tokens') { renderTokens(me); return; }
  if (view === 'more') { renderMore(me); return; }
  if (view === 'receive') {
    s.innerHTML = `<div class="card sheet"><h2>receive on ${esc(w.chain.name)}</h2><div class="qr" id="qr"></div><div class="mono">${esc(me.address)}</div><div class="actions" style="width:100%"><button class="ac" id="copy">copy address</button><button id="back">done</button></div>
      ${w.evm ? `<div class="tiny" style="margin-top:.4rem">EVM side, same key:</div><div class="mono">${esc(w.ethAddress(key))}</div>` : ''}<div class="tiny">script ${esc(me.script.slice(0, 12))}…</div></div>`;
    try { const qr = qrcode(0, 'M'); qr.addData(me.address.toUpperCase()); qr.make(); $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0 }); } catch { $('qr').textContent = 'QR unavailable'; }
    $('copy').onclick = async () => { try { await navigator.clipboard.writeText(me.address); $('copy').textContent = 'copied'; } catch { $('copy').textContent = 'select and copy'; } };
    $('back').onclick = () => { view = 'home'; render(); }; return;
  }
  s.innerHTML = `<div class="card"><h2>balance</h2><div class="big">${sats(b.spendable)}<small>sats</small></div>
      ${b.immature ? `<div class="mut">+ ${sats(b.immature)} maturing</div>` : ''}${w.evm ? `<div class="row" style="margin-top:.6rem"><span class="mut">EVM side</span><span><b id="evmbal">${evmBal === null ? '…' : sats(evmBal)}</b> <span class="mut">sats</span></span></div>` : ''}
      <div class="actions" style="margin-top:.8rem"><button class="ac" id="recv">receive</button><button id="faucet">get test coins</button></div><div class="tiny" id="fmsg" style="margin-top:.5rem"></div></div>
    <div class="card"><h2>coins</h2>${coins.length ? coins.slice(0, 6).map((c) => `<div class="row"><span class="mono">${esc(c.outpoint.slice(0, 10))}…</span><span>${sats(c.value)} <span class="mut">${c.mature ? '' : 'matures at ' + c.maturesAt}</span></span></div>`).join('') + (coins.length > 6 ? `<div class="tiny">and ${coins.length - 6} more</div>` : '') : '<div class="mut">nothing yet — ask the faucet, or receive from someone</div>'}</div>
    <div class="card"><h2>this chain</h2><div class="row"><span class="mut">id</span><span class="mono">${esc(w.chain.id)}</span></div><div class="row"><span class="mut">beside</span><span>${esc(w.chain.parent)}</span></div><div class="row"><span class="mut">rules</span><span>${esc((w.chain.rules ?? []).join(', ') || 'none')}</span></div><div class="row"><span class="mut">mirror</span><span class="mono">${esc(w.mirror.replace(/^https?:\/\//, ''))}</span></div></div>`;
  $('recv').onclick = () => { view = 'receive'; render(); };
  $('faucet').onclick = async () => { const btn = $('faucet'), m = $('fmsg'); btn.disabled = true; m.textContent = 'asking a faucet on the relays…'; try { const r = await w.requestFaucet(me.address, relays); if (!r.accepted) throw new Error('no relay accepted the request'); const before = w.balance(me.script).total;
      for (let i = 0; i < 12; i++) { await new Promise((res) => setTimeout(res, 5000)); await w.refresh(); if (w.balance(me.script).total > before) { m.textContent = ''; return render(); } m.textContent = `asked (${(i + 1) * 5} s)… coins arrive within a minute if a faucet is listening`; }
      m.textContent = 'no coins arrived; this address may have been paid in the last 24 h, or no faucet is listening'; } catch (e) { m.textContent = e.message; } finally { btn.disabled = false; } };
}
// --- send: the destination decides the mode — a sidechain address or script, a parent address (peg-out), a 0x address (EVM) ---
function kindOf(to) { to = to.trim(); if (/^0x[0-9a-fA-F]{40}$/.test(to)) return 'evm'; if (/^[0-9a-f]+$/i.test(to)) return 'send'; try { const a = w.address.decodeAddress(to); if (!a) return null; return a.hrp === w.hrp ? 'send' : (a.hrp === 'tb' || a.hrp === 'bc') ? 'pegout' : 'send'; } catch { return null; } }
function renderSend(me, b) {
  const s = $('screen'); const evm = !!w.evm;
  s.innerHTML = `<div class="card"><h2>send</h2>
    ${evm ? `<div class="seg" id="seg"><button data-m="send" class="${mode === 'send' ? 'on' : ''}">sats</button><button data-m="deposit" class="${mode === 'deposit' ? 'on' : ''}">to my EVM side</button><button data-m="withdraw" class="${mode === 'withdraw' ? 'on' : ''}">from my EVM side</button></div>` : ''}
    <div class="field" style="margin-top:.7rem"><label id="tolabel">${mode === 'deposit' ? 'your EVM address (from your sats)' : mode === 'withdraw' ? 'to your sidechain address (from your EVM balance)' : `to: a ${esc(w.hrp)}1p… address, a script, a parent tb1p… address to peg out${evm ? ', or a 0x address to pay from your EVM side' : ''}`}</label>
      <input id="to" class="mono" placeholder="${mode === 'deposit' ? esc(w.ethAddress(key)) : mode === 'withdraw' ? esc(me.address) : `${esc(w.hrp)}1p… / 0x… / tb1p…`}" ${mode === 'deposit' || mode === 'withdraw' ? 'disabled' : ''} autocomplete="off"></div>
    <div class="field" style="margin-top:.6rem"><label>amount in sats${evm ? ' (1 sat = 1 gwei on the EVM side)' : ''}</label><input id="amt" inputmode="numeric" placeholder="10000"></div>
    <div class="tiny" style="margin-top:.5rem">you have ${sats(b.spendable)} sats${evm && evmBal !== null ? ` · ${sats(evmBal)} on the EVM side` : ''}${w.pegoutMin ? ` · a peg-out burns at least ${sats(w.pegoutMin)}` : ''}</div>
    <div class="actions" style="margin-top:.8rem"><button class="ac" id="review">review</button><button id="cancel">cancel</button></div><div class="err" id="senderr" style="margin-top:.5rem"></div></div><div id="sheet"></div>`;
  if (evm) $('seg').querySelectorAll('button').forEach((x) => { x.onclick = () => { mode = x.dataset.m; renderSend(me, w.balance(me.script)); }; });
  $('cancel').onclick = () => go('home');
  $('review').onclick = async () => { const err = $('senderr'); err.textContent = ''; const to = $('to').value.trim(); const amount = Number($('amt').value.trim()); const btn = $('review'); btn.disabled = true;
    try { if (!Number.isInteger(amount) || amount <= 0) throw new Error('the amount is a whole number of sats'); let built, what, lines;
      if (mode === 'deposit') { built = w.build({ key, to: w.ethAddress(key), amount, evmDeposit: true }); what = `move ${sats(amount)} sats to your EVM side`; lines = [['credited to', w.ethAddress(key)], ['fee', `${sats(built.fee)} sats`]]; }
      else if (mode === 'withdraw') { built = await w.buildWithdraw({ key, sats: amount }); what = `move ${sats(amount)} sats from your EVM side to ${me.address.slice(0, 12)}…`; lines = [['gas', `${sats(built.gasUsed)} gwei`], ['EVM balance after', `${sats(built.evmAfter / 1000000000n)} sats`], ['carrier fee', `${sats(built.fee)} sats`]]; }
      else { const kind = kindOf(to); if (!kind) throw new Error('that is not an address this wallet knows');
        if (kind === 'evm') { if (!evm) throw new Error('this chain has no EVM side'); built = await w.buildEvm({ key, to, value: amount }); what = `send ${sats(amount)} gwei on the EVM side`; lines = [['to', to], ['gas', `${sats(built.gasUsed)} gwei`], ['EVM balance after', `${sats(built.evmAfter / 1000000000n)} sats`], ['carrier fee', `${sats(built.fee)} sats`]]; }
        else { built = w.build({ key, to, amount, pegout: kind === 'pegout' }); what = kind === 'pegout' ? `peg out ${sats(amount)} sats to ${to.slice(0, 12)}… on ${w.chain.parent}` : `send ${sats(amount)} sats`; lines = [['to', kind === 'pegout' ? `${to} on ${w.chain.parent}` : w.ex.address(built.tx.outputs[0].scriptPubKey)], ['fee', `${sats(built.fee)} sats`], ['change', `${sats(built.change)} sats`], ...(built.note ? [['note', built.note]] : [])]; } }
      if (!w.verify(built, key)) throw new Error('the signature did not verify; nothing was sent');
      pending = built; $('sheet').innerHTML = `<div class="card"><h2>review</h2><div style="font-weight:600;margin-bottom:.4rem">${esc(what)}</div>${lines.map(([k, v]) => `<div class="kv"><span class="mut">${esc(k)}</span><span class="${/^0x|^[a-z]+1p/.test(String(v)) ? 'mono' : ''}">${esc(v)}</span></div>`).join('')}<div class="kv"><span class="mut">txid</span><span class="mono">${esc(built.txid.slice(0, 20))}…</span></div>
        <div class="actions" style="margin-top:.8rem"><button class="ac" id="confirm">confirm and send</button><button id="drop">back</button></div><div id="progress" class="tiny" style="margin-top:.5rem"></div></div>`;
      $('drop').onclick = () => { pending = null; $('sheet').innerHTML = ''; }; $('confirm').onclick = () => confirmSend(built, me);
    } catch (e) { err.textContent = e.message; } finally { btn.disabled = false; } };
}
async function confirmSend(built, me) {
  const p = $('progress'); $('confirm').disabled = true; $('drop').disabled = true;
  try { const r = await w.publish(built.hex, relays); if (!r.accepted) throw new Error('no relay accepted the transaction'); p.textContent = 'published; waiting for the block…';
    for (let i = 0; i < 36; i++) { await new Promise((res) => setTimeout(res, 5000)); const m = await w.mined(built.txid); if (m) { const rc = built.ethHash ? w.evmReceipt(built.ethHash) : null; p.innerHTML = `<span class="${rc && rc.status !== 1 ? 'bad' : 'good'}">${rc ? (rc.status === 1 ? 'done' : 'mined, but the EVM call reverted') : 'sent'} in block ${m.height}</span>`; pending = null; refreshEvm(); setTimeout(() => go('activity'), 1500); return; } p.textContent = `published; waiting for the block… (${(i + 1) * 5} s)`; }
    p.innerHTML = '<span class="warn">published, but not on the mirror after 3 minutes; check activity later</span>';
  } catch (e) { p.innerHTML = `<span class="bad">${esc(e.message)}</span>`; $('confirm').disabled = false; $('drop').disabled = false; }
}
// --- more: every chain the relays announce (the directory's reading), and the settings the plain wallet keeps in its footer ---
let chainRows = null;
async function renderMore(me) {
  const s = $('screen'); const age = (t) => { if (!t) return '—'; const m = Math.round((Date.now() / 1000 - t) / 60); return m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  s.innerHTML = `<div class="card"><h2>chains</h2><div id="chains"><div class="mut">asking the relays…</div></div></div>
    <div class="card"><h2>settings</h2><div class="field"><label>relays (comma separated)</label><input id="relays" value="${esc(relays.join(','))}"><button id="saverelays" style="margin-top:.4rem">save and reload</button></div>
      <div class="field" style="margin-top:.8rem"><label>validation</label><div class="tiny">${w.fromCache === null ? 'every block of this chain was validated in this browser' : `resumed from the state saved here at block ${w.fromCache}; blocks since were validated now`}</div><button id="verifyfull" style="margin-top:.4rem">drop the saved state and validate every block again</button></div>
      ${me ? `<div class="field" style="margin-top:.8rem"><label>this key</label><div class="mono">${esc(me.address)}</div><div class="tiny">back it up before forgetting it: it is the only way to spend these coins</div><button id="showkey" style="margin-top:.4rem">show the key</button><div id="keybox" class="mono hidden" style="margin-top:.4rem;user-select:all"></div><button id="forget1" class="bad" style="margin-top:.4rem;background:var(--panel2)">forget this key in this browser</button><button id="forget2" class="hidden" style="margin-top:.4rem;background:var(--bad);color:#fff">yes, forget it</button></div>` : ''}</div>`;
  $('saverelays').onclick = () => { LS.set('sidestr_relays', $('relays').value.trim()); location.reload(); };
  $('verifyfull').onclick = async () => { await w.verifyFully(); location.reload(); };
  if (me) { $('showkey').onclick = () => { $('keybox').textContent = key; $('keybox').classList.toggle('hidden'); }; $('forget1').onclick = () => $('forget2').classList.remove('hidden'); $('forget2').onclick = () => { LS.del(`sidestr_key:${w.chain.id}`); key = null; go('home'); }; }
  if (!chainRows) { try { chainRows = await listChains({ relays }); } catch (e) { chainRows = []; } }
  const el = $('chains'); if (!el) return;
  el.innerHTML = chainRows.length ? chainRows.map((c) => `<a class="act" href="?chain=${encodeURIComponent(c.id)}"><div class="ic">${esc((c.name ?? c.id).slice(0, 2))}</div><div class="t"><div>${esc(c.name ?? c.id)}${c.id === w.chain.id ? ' <span class="tiny">· open</span>' : ''}${c.rules?.length ? ` <span class="tiny">· ${esc(c.rules.join(', '))}</span>` : ''}</div><div>${c.parent ? 'beside ' + esc(c.parent) + ' · ' : ''}block ${c.tip} · ${esc(age(c.lastBlock))}${c.ok === false ? ' · <span class="bad">no mirror</span>' : ''}</div></div><div class="amt tiny">${c.blocks24h} / day</div></a>`).join('') : '<div class="mut">no chains answered from the relays</div>';
}
// --- tokens: ERC-20 contracts this browser remembers for the chain, read from the page's own EVM state ---
async function renderTokens(me) {
  const s = $('screen'); const eth = w.ethAddress(key);
  s.innerHTML = `<div class="card"><h2>tokens</h2><div id="toklist"><div class="mut">reading…</div></div>
    <div class="field" style="margin-top:.8rem"><label>add a token by its contract address</label><div style="display:flex;gap:.5rem"><input id="tokaddr" class="mono" placeholder="0x…" autocomplete="off"><button id="tokadd">add</button></div><div class="err" id="tokerr"></div></div></div><div id="sheet"></div>`;
  $('tokadd').onclick = async () => { const a = $('tokaddr').value.trim().toLowerCase(); $('tokerr').textContent = ''; try { await w.token(a, eth); if (!tokens.includes(a)) tokens.push(a); LS.set(tokKey(), JSON.stringify(tokens)); renderTokens(me); } catch (e) { $('tokerr').textContent = e.message; } };
  const rows = []; for (const a of tokens) { try { const t = await w.token(a, eth); rows.push({ a, t }); } catch (e) { rows.push({ a, err: e.message }); } }
  const el = $('toklist'); if (!el) return;
  el.innerHTML = rows.length ? rows.map(({ a, t, err }) => `<div class="act"><div class="ic">${esc((t?.symbol ?? '?').slice(0, 3))}</div><div class="t"><div>${esc(t ? (t.name ?? t.symbol ?? a) : a)}</div><div>${err ? esc(err) : esc(a)}</div></div><div class="amt">${t ? esc(t.format(t.balance)) + ' ' + esc(t.symbol ?? '') : ''}</div>${t ? `<button data-send="${esc(a)}" style="padding:.4rem .7rem">send</button>` : `<button data-forget="${esc(a)}" style="padding:.4rem .7rem">forget</button>`}</div>`).join('') : '<div class="mut">no tokens yet; add one by its contract address</div>';
  el.querySelectorAll('[data-forget]').forEach((x) => { x.onclick = () => { tokens = tokens.filter((y) => y !== x.dataset.forget); LS.set(tokKey(), JSON.stringify(tokens)); renderTokens(me); }; });
  el.querySelectorAll('[data-send]').forEach((x) => { x.onclick = () => { const row = rows.find((r) => r.a === x.dataset.send); $('sheet').innerHTML = `<div class="card"><h2>send ${esc(row.t.symbol ?? 'tokens')}</h2><div class="field"><label>to: a 0x address</label><input id="tto" class="mono" placeholder="0x…"></div><div class="field" style="margin-top:.5rem"><label>amount (${row.t.decimals} decimals)</label><input id="tamt" inputmode="decimal" placeholder="1.5"></div><div class="actions" style="margin-top:.8rem"><button class="ac" id="treview">review</button><button id="tcancel">cancel</button></div><div class="err" id="terr"></div><div id="tsheet"></div></div>`;
    $('tcancel').onclick = () => { $('sheet').innerHTML = ''; };
    $('treview').onclick = async () => { $('terr').textContent = ''; try { const built = await w.buildTokenTransfer({ key, contract: row.a, to: $('tto').value.trim(), amount: $('tamt').value.trim() }); if (!w.verify(built, key)) throw new Error('the signature did not verify');
        $('tsheet').innerHTML = `<div class="kv"><span class="mut">to</span><span class="mono">${esc($('tto').value.trim())}</span></div><div class="kv"><span class="mut">amount</span><span>${esc($('tamt').value.trim())} ${esc(row.t.symbol ?? '')}</span></div><div class="kv"><span class="mut">gas</span><span>${sats(built.gasUsed)} gwei</span></div><div class="kv"><span class="mut">carrier fee</span><span>${sats(built.fee)} sats</span></div><div class="actions" style="margin-top:.6rem"><button class="ac" id="confirm">confirm and send</button><button id="drop">back</button></div><div id="progress" class="tiny"></div>`;
        $('drop').onclick = () => { $('tsheet').innerHTML = ''; }; $('confirm').onclick = () => confirmSend(built, me); } catch (e) { $('terr').textContent = e.message; } }; }; });
}
function go(tab) { view = tab; document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab)); render(); }
document.querySelectorAll('.tabs button').forEach((btn) => { btn.onclick = () => { if (!btn.disabled) go(btn.dataset.tab); }; });
boot();
</script>
</body>
